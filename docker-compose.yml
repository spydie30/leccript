services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lecture
      POSTGRES_PASSWORD: lecture
      POSTGRES_DB: lecture_rag
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lecture -d lecture_rag"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://lecture:lecture@db:5432/lecture_rag
      REDIS_URL: redis://redis:6379/0
      EMBED_DIM: "1024"   # must match the embedding model you pick
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
